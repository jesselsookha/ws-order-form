<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Form</title>
    <style>
        body {
            font-family: "Courier New", Courier, monospace;
            font-size: 15px;
            color: #000000;
            background-color: #ffffff;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            font-size: 1.4rem;
            border-bottom: 1px solid #000000;
            padding-bottom: 6px;
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 30px;
        }

        table {
            margin: 0;
        }

        td {
            padding: 4px 8px 4px 0;
            vertical-align: middle;
        }

        label {
            display: inline-block;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"] {
            font-family: "Courier New", Courier, monospace;
            font-size: 15px;
            padding: 4px 6px;
            border: 1px solid #000000;
            background-color: #ffffff;
            width: 220px;
        }

        button {
            font-family: "Courier New", Courier, monospace;
            font-size: 15px;
            padding: 6px 14px;
            border: 1px solid #000000;
            background-color: #ffffff;
            color: #000000;
            cursor: pointer;
        }

        button:hover {
            background-color: #eeeeee;
        }

        #response {
            margin-top: 20px;
            padding: 12px;
            border: 1px solid #000000;
            min-height: 20px;
            white-space: pre-wrap;
        }

        .error {
            color: #800000;
            font-weight: bold;
        }

        hr {
            border: none;
            border-top: 1px solid #000000;
            margin: 30px 0;
        }
    </style>
</head>
<body>

    <h1>Order Form</h1>

    <form id="orderForm">

        <table border="0" cellpadding="4" cellspacing="0">

            <tr>
                <td><label for="customerName">Customer Name:</label></td>
                <td><input type="text" id="customerName"></td>
            </tr>

            <tr>
                <td><label for="product">Product:</label></td>
                <td><input type="text" id="product"></td>
            </tr>

            <tr>
                <td><label for="quantity">Quantity:</label></td>
                <td><input type="number" id="quantity"></td>
            </tr>

            <tr>
                <td><label for="price">Price:</label></td>
                <td><input type="number" id="price"></td>
            </tr>

            <tr>
                <td></td>
                <td><button type="submit">Place Order</button></td>
            </tr>

        </table>

    </form>

    <div id="response"></div>

    <script>
        // ============================================
        // STUDENTS WRITE ALL JAVASCRIPT HERE
        // ============================================
    </script>

</body>
</html>
